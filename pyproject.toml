[project]
name = "animal-dash-image-poc"
version = "0.1.0"
description = "Animal Dash: paper drawing -> OpenCV preprocessing -> Gemini status judgment PoC"
requires-python = ">=3.13"
dependencies = [
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
    "python-dotenv>=1.0,<2",
    "google-genai>=0.7,<2",
    "fastapi>=0.117,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["animal_dash_image_poc"]
