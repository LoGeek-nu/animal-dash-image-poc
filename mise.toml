# mise は任意（Pythonバージョン固定 + タスクランナー）。
# mise が無い環境向けの手動セットアップ手順は README.md 参照。
[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the project (editable) into the mise-managed venv"
run = "uv pip install -e ."

# samples/ にはテスト用の画像（実写真やモックアップ）を各自置く。以下は一例として
# samples/dragon.png を対象にしているので、手元のファイル名に合わせて書き換えて使う。

[tasks.run]
description = "Run the full pipeline (preprocess + Gemini status) on a sample image"
run = "python -m animal_dash_image_poc.cli run samples/dragon.png -o output/dragon"

[tasks.preprocess]
description = "Run only the OpenCV preprocessing step on a sample image"
run = "python -m animal_dash_image_poc.cli preprocess samples/dragon.png -o output/dragon.png --debug output/debug_dragon"

[tasks.run-all]
description = "Run the full pipeline (preprocess + Gemini status) on every image in samples/"
run = "python scripts/run_all.py"

[tasks.api]
description = "Run the HTTP API (app.py, same entrypoint Vercel uses) locally with auto-reload"
run = "uv pip install -e '.[dev]' && uvicorn app:app --reload --port 8000"
